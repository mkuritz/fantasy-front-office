name: Update fantasy data
# Free-tier friendly: a tiny change check runs often (~20 s); the full recompute runs only when
# significant NFL news is detected, on a twice-daily baseline, or manually.
on:
  schedule:
    # Primary schedule lives in the Cloudflare sl-scheduler (2-hourly checks, 7:20 AM/PM full). Sparse daily backup:
    - cron: "7 15 * * *"   # ~11 AM ET full baseline
  workflow_dispatch:
    inputs:
      mode:
        description: "check (light, full only if news changed) or full"
        default: "full"
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Light news / injury check
        id: check
        run: python scripts/check_news.py
      - name: Decide
        id: decide
        run: |
          if [ "${{ steps.check.outputs.changed }}" = "true" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" != "check" ]; } || [ "${{ github.event.schedule }}" = "7 15 * * *" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"; else echo "full=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.decide.outputs.full == 'true'
        with:
          python-version: "3.12"
      - name: Full recompute
        if: steps.decide.outputs.full == 'true'
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          TRIGGER: ${{ steps.check.outputs.changed == 'true' && 'news' || github.event_name }}
        run: python scripts/fetch_data.py
      - name: AI Fantasy Manager narratives (free, template engine)
        if: steps.decide.outputs.full == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          TRIGGER: ${{ steps.check.outputs.changed == 'true' && 'news' || github.event_name }}
        run: python scripts/ai_manager.py
      - name: Cross-check free sources (optional)
        if: steps.decide.outputs.full == 'true'
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/ffo_xcheck.py
      - name: Season guard (current season from date + same-day live roster check)
        continue-on-error: true
        run: python scripts/season_guard.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898475+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/ ':!data/meta.json' ':!data/check_state.json'; then echo "No data changes"; exit 0; fi
          git commit -m "Update fantasy data $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          git pull --rebase -q && git push
